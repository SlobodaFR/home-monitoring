name: home-monitoring

services:
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      # Enables Dozzle's built-in MCP server (Streamable HTTP) at /api/mcp.
      # See https://dozzle.dev/guide/mcp
      DOZZLE_ENABLE_MCP: 'true'
    ports:
      # Internal only. Publicly reachable via the reverse proxy (see deploy/Caddyfile).
      - '127.0.0.1:3008:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # users.yml is generated at deploy time (see deploy/scripts/update-vps.sh)
      # from MONITORING_DOZZLE_USERNAME / MONITORING_DOZZLE_PASSWORD. Never committed.
      - ./data/dozzle:/data

  vector:
    image: timberio/vector:latest-alpine
    restart: unless-stopped
    # The image's default entrypoint looks for /etc/vector/vector.yaml; point
    # it at our .toml file explicitly.
    command: ['--config', '/etc/vector/vector.toml']
    env_file: .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # s3.sloboda.cc resolves to both A and AAAA (Cloudflare) records. The
    # aws-sdk-rust HTTP client Vector's aws_s3 sink uses doesn't fall back
    # from an unreachable AAAA to the working A record the way curl/wget do
    # (confirmed: disabling IPv6 via sysctl alone didn't fix it). Pinning
    # the hostname to its Cloudflare IPv4 addresses in /etc/hosts removes
    # AAAA from resolution entirely. If this starts failing again, Cloudflare
    # may have rotated these IPs - re-check with `dig s3.sloboda.cc A`.
    extra_hosts:
      - 's3.sloboda.cc:104.21.75.185'
      - 's3.sloboda.cc:172.67.180.30'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.toml:/etc/vector/vector.toml:ro
