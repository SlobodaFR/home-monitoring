name: home-monitoring

services:
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      # Enables Dozzle's built-in MCP server (Streamable HTTP) at /api/mcp.
      # See https://dozzle.dev/guide/mcp
      DOZZLE_ENABLE_MCP: 'true'
    ports:
      # Internal only. Publicly reachable via the reverse proxy (see deploy/Caddyfile).
      - '127.0.0.1:3008:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # users.yml is generated at deploy time (see deploy/scripts/update-vps.sh)
      # from MONITORING_DOZZLE_USERNAME / MONITORING_DOZZLE_PASSWORD. Never committed.
      - ./data/dozzle:/data

  vector:
    image: timberio/vector:latest-alpine
    restart: unless-stopped
    # The image's default entrypoint looks for /etc/vector/vector.yaml; point
    # it at our .toml file explicitly.
    command: ['--config', '/etc/vector/vector.toml']
    env_file: .env
    environment:
      # Env-var interpolation (${MINIO_BUCKET} etc. in vector.toml) is
      # disabled by default since Vector 0.4x; must opt in explicitly or
      # every ${VAR} in the config is passed through as a literal string.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: 'true'
      # TEMP: surface the real error behind the generic "dispatch failure"
      # wrapper. Drop back to default (unset) once the sink is confirmed
      # working.
      VECTOR_LOG: debug
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.toml:/etc/vector/vector.toml:ro
